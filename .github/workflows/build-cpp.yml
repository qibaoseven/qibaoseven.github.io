name: build-cpp

# cpp/v0.46 有新提交就编译 Linux 静态单文件并发到 Release（tag: cpp-latest）
on:
  push:
    branches: ['cpp/v0.46']
    paths:
      - 'cpp/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 linux-static
        run: |
          cd cpp
          make linux-static
          cp openstu-linux ../openstu-v0.46-linux-x86_64
          file ../openstu-v0.46-linux-x86_64
          ls -lh ../openstu-v0.46-linux-x86_64

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cpp-latest
          name: C++ 后端 · cpp/v0.46
          prerelease: true
          body: |
            自动编译自 `cpp/v0.46` 分支，提交 ${{ github.sha }}
            Linux x86_64 静态单文件，拷到任意发行版直接跑：`./openstu-v0.46-linux-x86_64`
          files: openstu-v0.46-linux-x86_64
