# xcodegen：在 clients/swift 目录跑 `xcodegen generate`
# 五个端都做：iOS / macOS / tvOS / watchOS / visionOS。
# 唯一例外：iOS 的「串口 / 刷录」在系统层面无法实现，界面上明确提示，不假装可用。
name: OpenStu
options:
  bundleIdPrefix: io.qibaoseven
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.46"
    CURRENT_PROJECT_VERSION: "46"

targets:
  OpenStuIOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qibaoseven.openstu.ios
        PRODUCT_NAME: OpenStu
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenStu 交作业
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  OpenStuMac:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Shared
      - path: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qibaoseven.openstu.mac
        PRODUCT_NAME: OpenStu
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 qibaoseven"

  OpenStuTV:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qibaoseven.openstu.tv
        PRODUCT_NAME: OpenStu
        GENERATE_INFOPLIST_FILE: YES

  OpenStuWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared
      - path: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qibaoseven.openstu.watch
        PRODUCT_NAME: OpenStu
        GENERATE_INFOPLIST_FILE: YES

  OpenStuVision:
    type: application
    platform: visionOS
    deploymentTarget: "1.0"
    sources:
      - path: Shared
      - path: visionOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qibaoseven.openstu.vision
        PRODUCT_NAME: OpenStu
        GENERATE_INFOPLIST_FILE: YES
